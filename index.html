<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rock N Rot</title>
<meta name="description" content="Rock N Rot, a Roblox game about mining in the dark and the essence that is spreading through it.">
<meta property="og:title" content="Rock N Rot">
<meta property="og:description" content="A Roblox game about mining in the dark and the essence that is spreading through it.">
<meta property="og:image" content="images/graveyard.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #16161d;          /* eigengrau */
    --text: #d0d0dc;
    --muted: #9b9bae;
    --line: #2b2b38;
    --essence: #ffe600;
    --lantern: #e8913a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  body {
    min-height: 100vh;
    font-family: "Inter", system-ui, sans-serif;
    color: var(--text);
    background: var(--bg);
    overflow-x: hidden;
  }

  /* drifting essence motes */
  .motes { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .motes i {
    position: absolute; bottom: -10px; width: 3px; height: 3px;
    background: var(--essence); border-radius: 50%;
    box-shadow: 0 0 8px 2px #ffe60088;
    opacity: 0; animation: rise linear infinite;
  }
  @keyframes rise {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    10%  { opacity: .8; }
    90%  { opacity: .6; }
    100% { transform: translateY(-105vh) translateX(30px); opacity: 0; }
  }

  main { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 0 20px 80px; }

  header { text-align: center; padding: 48px 0 52px; }
  h1 { line-height: 0; }
  h1 img { width: min(100%, 560px); height: auto; }
  header p {
    max-width: 540px; margin: 28px auto 0;
    font-size: 1.05rem; line-height: 1.7; color: var(--muted);
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
  }
  .gallery button {
    all: unset; cursor: zoom-in; display: block; position: relative;
    border-radius: 6px; overflow: hidden;
    border: 1px solid var(--line);
    background: #0e0e13;
    transition: border-color .25s, box-shadow .25s, transform .25s;
  }
  .gallery button:hover, .gallery button:focus-visible {
    border-color: var(--lantern);
    box-shadow: 0 0 0 1px var(--lantern), 0 8px 40px #e8913a33;
    transform: translateY(-3px);
  }
  .gallery img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; }

  /* lightbox */
  .lightbox {
    position: fixed; inset: 0; z-index: 10; display: none;
    align-items: center; justify-content: center;
    background: #0a0a0eee; padding: 20px; cursor: zoom-out;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100%; max-height: 100%; border: 1px solid var(--lantern); box-shadow: 0 0 60px #e8913a33; }

  @media (max-width: 640px) {
    header { padding: 28px 0 36px; }
    .gallery { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { .motes { display: none; } }
</style>
</head>
<body>

<div class="motes" aria-hidden="true"></div>

<main>
  <header>
    <h1><img src="logo.svg" alt="Rock N Rot"></h1>
    <p>
      Dig deep into the dark, where something yellow is spreading.
      Rock&nbsp;N&nbsp;Rot is a Roblox game about mining, surviving, and the essence
      that is slowly consuming everything around you.
    </p>
  </header>

  <section class="gallery" aria-label="Screenshots">
    <button type="button"><img src="images/screenshot1.jpg" alt="The graveyard hub with the stone statue at night" loading="lazy"></button>
    <button type="button"><img src="images/essence.png" alt="Hanging cages above the fog" loading="lazy"></button>
    <button type="button"><img src="images/image.png" alt="Mine tracks lit by lanterns" loading="lazy"></button>
    <button type="button"><img src="images/sdsads.png" alt="Glowing essence in a dark cave" loading="lazy"></button>
  </section>
</main>

<div class="lightbox" role="dialog" aria-label="Enlarged screenshot"><img alt=""></div>

<script>
  // essence motes
  const motes = document.querySelector('.motes');
  for (let i = 0; i < 28; i++) {
    const m = document.createElement('i');
    m.style.left = Math.random() * 100 + '%';
    m.style.animationDuration = (10 + Math.random() * 16) + 's';
    m.style.animationDelay = (-Math.random() * 26) + 's';
    m.style.transform = 'scale(' + (0.6 + Math.random() * 1.2) + ')';
    motes.appendChild(m);
  }

  // lightbox
  const lb = document.querySelector('.lightbox');
  const lbImg = lb.querySelector('img');
  document.querySelectorAll('.gallery img').forEach(img => {
    img.parentElement.addEventListener('click', () => {
      lbImg.src = img.src; lbImg.alt = img.alt; lb.classList.add('open');
    });
  });
  lb.addEventListener('click', () => lb.classList.remove('open'));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') lb.classList.remove('open'); });
</script>
</body>
</html>
